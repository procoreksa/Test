<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-labelledby="t">
  <title id="t">ProCore Media</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3D8B"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#2EC5FF"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3D8B"/>
      <stop offset="0.5" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#7B5CFF"/>
    </linearGradient>
  </defs>

  <!-- Mark: three overlapping colour petals around a white play button -->
  <g transform="translate(100 100)">
    <circle cx="-18" cy="-14" r="52" fill="url(#g1)" opacity="0.92"/>
    <circle cx="20" cy="-10" r="52" fill="url(#g2)" opacity="0.85"/>
    <circle cx="0" cy="22" r="52" fill="#FFC93D" opacity="0.85"/>
    <path d="M-14 -22 L26 0 L-14 22 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="190" y="112" font-family="Poppins, Montserrat, 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="800" fill="#1B1B2F" letter-spacing="-1">Pro<tspan fill="url(#g3)">Core</tspan></text>
  <text x="194" y="150" font-family="Poppins, Montserrat, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#1B1B2F" letter-spacing="14">MEDIA</text>
</svg>
